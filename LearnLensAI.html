<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LearnLens AI</title>
  <meta name="description" content="LearnLens AI — Learn smarter. Understand deeper. Improve every day." />
  <style>
    :root {
      --bg-primary: #070A12;
      --bg-secondary: #0B1020;
      --bg-card: rgba(17, 24, 39, 0.65);
      --bg-card-elevated: #111827;
      --border-subtle: rgba(148, 163, 184, 0.12);
      --border-strong: rgba(148, 163, 184, 0.24);

      --purple: #8B5CF6;
      --violet: #7C3AED;
      --cyan: #22D3EE;
      --blue: #3B82F6;

      --success: #22C55E;
      --warning: #F59E0B;
      --danger: #EF4444;

      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --gradient-brand: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 55%, #22D3EE 100%);
      --gradient-glow-purple: radial-gradient(circle, rgba(139,92,246,0.35), transparent 70%);
      --gradient-glow-cyan: radial-gradient(circle, rgba(34,211,238,0.28), transparent 70%);

      --shadow-card: 0 8px 30px rgba(0,0,0,0.35);
      --shadow-glow-active: 0 0 24px rgba(139,92,246,0.45);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 999px;

      --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
      --duration-fast: 120ms;
      --duration-base: 220ms;
      --duration-slow: 420ms;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: -3;
      width: 520px;
      height: 520px;
      filter: blur(120px);
      opacity: 0.14;
      border-radius: 999px;
    }

    body::before {
      top: -180px;
      left: -140px;
      background: var(--purple);
    }

    body::after {
      right: -180px;
      bottom: -160px;
      background: var(--cyan);
      opacity: 0.11;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mix-blend-mode: overlay;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled,
    input:disabled,
    textarea:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    :focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
      border-radius: 10px;
    }

    .app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100vh;
      transition: grid-template-columns var(--duration-base) var(--ease-standard);
    }

    .app.collapsed {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--border-subtle);
      background: rgba(7, 10, 18, .78);
      backdrop-filter: blur(18px);
      min-height: 100vh;
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 18px 12px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 18px;
      min-height: 58px;
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
    }

    .brand-text {
      line-height: 1.05;
      overflow: hidden;
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: -0.03em;
      font-size: 1.05rem;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: .72rem;
      margin-top: 3px;
    }

    .collapsed .brand-text,
    .collapsed .nav-label,
    .collapsed .nav-section,
    .collapsed .collapse-label {
      display: none;
    }

    .nav-section {
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: .68rem;
      letter-spacing: .08em;
      margin: 16px 10px 7px;
    }

    .nav-item {
      width: 100%;
      border: 0;
      color: var(--text-secondary);
      background: transparent;
      min-height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      position: relative;
      transition: background var(--duration-fast), color var(--duration-fast), transform var(--duration-fast);
      text-align: left;
    }

    .nav-item:hover {
      background: rgba(148,163,184,.07);
      color: var(--text-primary);
    }

    .nav-item.active {
      color: var(--text-primary);
      background: rgba(139, 92, 246, .08);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 2px;
      border-radius: 999px;
      background: var(--gradient-brand);
      box-shadow: var(--shadow-glow-active);
    }

    .nav-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      font-size: 1.05rem;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 25;
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(260px, 520px) auto;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(7, 10, 18, .72);
      backdrop-filter: blur(18px);
    }

    .mobile-menu {
      display: none;
    }

    .page-title {
      font-weight: 750;
      letter-spacing: -.02em;
      font-size: 1.12rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-trigger {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      background: rgba(17,24,39,.42);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 16px;
    }

    .kbd {
      border: 1px solid var(--border-strong);
      background: rgba(148,163,184,.08);
      border-radius: 8px;
      padding: 2px 7px;
      color: var(--text-secondary);
      font-size: .75rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius-pill);
      background: rgba(17,24,39,.65);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      position: relative;
    }

    .icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 17px;
      height: 17px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      font-size: .65rem;
      border-radius: 999px;
      background: var(--danger);
      color: white;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: var(--gradient-brand);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .content {
      padding: 24px;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(18px);
      padding: 18px;
      min-width: 0;
      animation: rise .38s var(--ease-standard);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card.elevated {
      background: var(--bg-card-elevated);
    }

    .muted {
      color: var(--text-muted);
    }

    .secondary {
      color: var(--text-secondary);
    }

    .micro {
      font-size: .75rem;
    }

    .small {
      font-size: .875rem;
    }

    h1,h2,h3,p {
      margin-top: 0;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.1;
      letter-spacing: -.03em;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 1.5rem;
      line-height: 1.2;
      letter-spacing: -.02em;
      margin-bottom: 12px;
    }

    h3 {
      font-size: 1.15rem;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(320px, .8fr);
      gap: 18px;
      align-items: stretch;
    }

    .ai-box {
      border-radius: 24px;
      border: 1px solid rgba(139,92,246,.24);
      background:
        radial-gradient(circle at 15% 10%, rgba(139,92,246,.22), transparent 32%),
        rgba(17,24,39,.62);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .ai-box textarea,
    .input,
    .select {
      width: 100%;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: rgba(7,10,18,.42);
      color: var(--text-primary);
      padding: 12px 14px;
      resize: vertical;
      min-height: 44px;
    }

    textarea::placeholder,
    input::placeholder {
      color: var(--text-muted);
    }

    .ai-input-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .btn {
      min-height: 42px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      background: rgba(17,24,39,.85);
      color: var(--text-primary);
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform var(--duration-fast), border var(--duration-fast), background var(--duration-fast);
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .btn.primary {
      border: 0;
      background: var(--gradient-brand);
      color: white;
      box-shadow: 0 0 18px rgba(139,92,246,.25);
    }

    .btn.danger {
      border-color: rgba(239,68,68,.3);
      color: #fecaca;
      background: rgba(239,68,68,.09);
    }

    .btn.ghost {
      background: transparent;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      border: 1px solid var(--border-subtle);
      background: rgba(148,163,184,.07);
      color: var(--text-secondary);
      min-height: 32px;
      border-radius: var(--radius-pill);
      padding: 6px 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: .84rem;
    }

    .chip.active {
      border-color: rgba(139,92,246,.45);
      background: rgba(139,92,246,.12);
      color: var(--text-primary);
    }

    .stat {
      min-height: 128px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-num {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      letter-spacing: -.03em;
      font-size: 2rem;
      margin-top: 6px;
    }

    .trend.up {
      color: var(--success);
    }

    .trend.down {
      color: var(--danger);
    }

    .orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--gradient-brand);
      box-shadow: 0 0 34px rgba(139,92,246,.5), inset 0 0 22px rgba(255,255,255,.18);
      position: relative;
      animation: orbPulse 3s ease-in-out infinite;
      flex: 0 0 auto;
    }

    .orb.small {
      width: 34px;
      height: 34px;
    }

    .orb.large {
      width: 150px;
      height: 150px;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: inherit;
      border: 1px solid rgba(255,255,255,.35);
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(.98); filter: saturate(1); }
      50% { transform: scale(1.04); filter: saturate(1.25); }
    }

    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(148,163,184,.08);
      border-radius: 10px;
    }

    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      to { transform: translateX(100%); }
    }

    .plan-item,
    .notification-item,
    .material-item,
    .topic-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: rgba(7,10,18,.28);
      margin-top: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--text-muted);
      box-shadow: 0 0 14px currentColor;
    }

    .status-mastered { color: var(--success); background: var(--success); }
    .status-strong { color: var(--blue); background: var(--blue); }
    .status-learning { color: var(--purple); background: var(--purple); }
    .status-needs_revision { color: var(--warning); background: var(--warning); }
    .status-weak { color: var(--danger); background: var(--danger); }
    .status-not_started { color: #334155; background: #334155; }

    .bar {
      height: 9px;
      background: rgba(148,163,184,.09);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: var(--w, 50%);
      background: var(--gradient-brand);
      border-radius: inherit;
    }

    .mini-graph,
    .map-wrap {
      min-height: 240px;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 50% 50%, rgba(139,92,246,.1), transparent 55%), rgba(7,10,18,.25);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      position: relative;
    }

    svg {
      max-width: 100%;
    }

    .route {
      display: none;
    }

    .route.active {
      display: block;
    }

    .chat-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 300px;
      gap: 16px;
      min-height: calc(100vh - 120px);
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 580px;
    }

    .messages {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .message {
      max-width: 82%;
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 12px 14px;
      background: rgba(17,24,39,.72);
      line-height: 1.58;
      color: var(--text-secondary);
    }

    .message.user {
      align-self: flex-end;
      background: rgba(59,130,246,.14);
      color: var(--text-primary);
    }

    .message.ai {
      align-self: flex-start;
    }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    pre {
      overflow: auto;
      padding: 12px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid var(--border-subtle);
    }

    code {
      color: #bae6fd;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: auto;
      display: block;
    }

    th, td {
      border: 1px solid var(--border-subtle);
      padding: 8px;
      color: var(--text-secondary);
    }

    .flashcard {
      width: min(680px, 100%);
      aspect-ratio: 3 / 2;
      margin: 0 auto;
      perspective: 1200px;
    }

    .flash-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .55s var(--ease-standard);
    }

    .flashcard.flipped .flash-inner {
      transform: rotateY(180deg);
    }

    .flash-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 26px;
      border: 1px solid rgba(139,92,246,.24);
      background:
        radial-gradient(circle at top left, rgba(139,92,246,.18), transparent 45%),
        var(--bg-card-elevated);
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
      font-size: clamp(1rem, 2.3vw, 1.6rem);
      line-height: 1.45;
      box-shadow: var(--shadow-card);
    }

    .flash-face.back {
      transform: rotateY(180deg);
      background:
        radial-gradient(circle at bottom right, rgba(34,211,238,.14), transparent 45%),
        var(--bg-card-elevated);
    }

    .editor {
      min-height: 420px;
      outline: none;
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(7,10,18,.32);
      border: 1px solid var(--border-subtle);
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .question-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .q-dot {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      background: rgba(148,163,184,.07);
      color: var(--text-secondary);
    }

    .q-dot.active {
      color: white;
      background: var(--gradient-brand);
    }

    .q-dot.flagged {
      border-color: var(--warning);
      box-shadow: 0 0 0 1px rgba(245,158,11,.25);
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 5px;
      align-items: end;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 6px;
      background: rgba(148,163,184,.08);
      border: 1px solid rgba(148,163,184,.06);
      position: relative;
    }

    .heat-cell:hover::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      white-space: nowrap;
      background: #020617;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: .75rem;
      z-index: 9;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.72);
      backdrop-filter: blur(10px);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-card);
      border-radius: 24px;
      padding: 18px;
    }

    .cmd-input {
      width: 100%;
      height: 52px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background: rgba(7,10,18,.55);
      color: var(--text-primary);
      padding: 0 16px;
      margin-bottom: 14px;
    }

    .cmd-result {
      padding: 12px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--text-secondary);
    }

    .cmd-result:hover,
    .cmd-result.active {
      background: rgba(139,92,246,.11);
      color: var(--text-primary);
    }

    .floating-ai {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
    }

    .fab {
      width: 62px;
      height: 62px;
      border-radius: 999px;
      border: 0;
      background: var(--gradient-brand);
      color: white;
      box-shadow: 0 0 30px rgba(139,92,246,.45);
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      animation: subtlePulse 3s ease-in-out infinite;
    }

    .fab.stop-pulse {
      animation: none;
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: .9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.035); }
    }

    .fab-pop {
      display: none;
      position: absolute;
      bottom: 76px;
      right: 0;
      width: 280px;
      border-radius: 20px;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-strong);
      padding: 10px;
      box-shadow: var(--shadow-card);
    }

    .fab-pop.show {
      display: block;
    }

    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      padding: 0;
    }

    .auth-brand {
      padding: 36px;
      background:
        radial-gradient(circle at 20% 20%, rgba(139,92,246,.28), transparent 36%),

        rgba(17,24,39,.8);
    }

    .auth-form {
      padding: 36px;
    }

    .hidden {
      display: none !important;
    }

    .bottom-tabs {
      display: none;
    }

    .exam-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg-primary);
      display: none;
      flex-direction: column;
    }

    .exam-fullscreen.show {
      display: flex;
    }

    .exam-header {
      height: 64px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(7,10,18,.85);
    }

    .voice-state.listening .orb {
      animation: listenPulse .7s ease-in-out infinite;
    }

    .voice-state.speaking .orb {
      animation: speakPulse .45s ease-in-out infinite;
    }

    @keyframes listenPulse {
      0%,100% { transform: scale(1); box-shadow: 0 0 24px rgba(34,211,238,.3); }
      50% { transform: scale(1.08); box-shadow: 0 0 44px rgba(34,211,238,.58); }
    }

    @keyframes speakPulse {
      0%,100% { transform: scale(.98); }
      50% { transform: scale(1.03); }
    }

    .image-stage {
      position: relative;
      min-height: 360px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: grid;
      place-items: center;
      background: rgba(7,10,18,.32);
    }

    .selection-box {
      position: absolute;
      border: 2px solid var(--cyan);
      background: rgba(34,211,238,.12);
      display: none;
      pointer-events: none;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .brand-text,
      .nav-label,
      .nav-section,
      .collapse-label {
        display: none;
      }

      .hero,
      .chat-layout {
        grid-template-columns: 1fr;
      }

      .chat-layout > .card:first-child,
      .chat-layout > .card:last-child {
        display: none;
      }

      .grid-4 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .search-trigger {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .app {
        display: block;
        padding-bottom: 70px;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        transform: translateX(-105%);
        transition: transform var(--duration-base) var(--ease-standard);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .brand-text,
      .nav-label,
      .nav-section,
      .collapse-label {
        display: block;
      }

      .topbar {
        height: 64px;
        padding: 0 14px;
        grid-template-columns: auto minmax(0, 1fr) auto;
      }

      .mobile-menu {
        display: grid;
      }

      .page-title {
        font-size: 1rem;
      }

      .top-actions .icon-btn:not(:last-child),
      .top-actions .avatar {
        display: none;
      }

      .content {
        padding: 16px;
      }

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .auth-card {
        grid-template-columns: 1fr;
      }

      .auth-brand {
        display: none;
      }

      .message {
        max-width: 94%;
      }

      .modal-backdrop {
        align-items: stretch;
        padding: 0;
      }

      .modal {
        border-radius: 0;
        max-height: 100vh;
      }

      .floating-ai {
        right: 16px;
        bottom: 82px;
      }

      .bottom-tabs {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 68px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        z-index: 50;
        background: rgba(7,10,18,.9);
        backdrop-filter: blur(18px);
        border-top: 1px solid var(--border-subtle);
      }

      .bottom-tabs button {
        border: 0;
        background: transparent;
        color: var(--text-secondary);
        display: grid;
        place-items: center;
        font-size: .72rem;
      }

      .bottom-tabs button.active {
        color: white;
      }
    }
  </style>
</head>

      return structuredClone(defaultDb);

      if (hash.startsWith("#/quizzes")) return "Quiz Lab";
      return "LearnLens AI";

    function tutorAnswer(q) {
      return `
### Core explanation
${q || "This concept"} can be understood by breaking it into smaller steps. In Class 8 terms, focus first on what is known, what is unknown, and what rule connects them.

### Analogy
Think of it like balancing a scale. If you add, subtract, multiply, or divide one side, you must do the same to the other side so the balance remains fair.

### Key terms
- **Variable:** the unknown value.
- **Coefficient:** the number multiplying a variable.
- **Equation:** a statement where two expressions are equal.
- **Check:** substitute your answer back to verify.

### Example with code, table, and math
\`\`\`js
const x = 15 - 7;
console.log(x); // 8
\`\`\`

| Step | Action |
|---|---|
| 1 | Identify the variable |
| 2 | Isolate it |
| 3 | Check the answer |

Math form: \\(x + 7 = 15 \\Rightarrow x = 8\\)

Would you like a 3-question quiz on this?
      `.trim();
    }

    function formatMarkdown(text) {
      let html = escapeHtml(text)
        .replace(/```([\s\S]*?)```/g, (_, code) => `<pre><button class="btn micro" onclick="copyText(this)">Copy</button><code>${code.trim()}</code></pre>`)
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^- (.*)$/gm, "<li>$1</li>")
        .replace(/\\\((.*?)\\\)/g, `<span class="chip">Math: $1</span>`)
        .replace(/\n\|(.+)\|\n\|(.+)\|\n((?:\|.+\|\n?)+)/g, (m) => `<pre>${m}</pre>`)
        .replace(/\n\n/g, "<br><br>");
      html = html.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
      return html;
    }

    function gradeCard(grade) {
      const deck = db.decks.find(d => d.id === activeDeckId);
      const card = deck.cards[activeCardIndex % deck.cards.length];
      const quality = { again: 1, hard: 3, good: 4, easy: 5 }[grade];
      const oldEf = card.ef || 2.5;
      card.ef = Math.max(1.3, oldEf + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
      if (grade === "again") card.interval = 1;
      else if (!card.interval) card.interval = grade === "easy" ? 4 : 2;
      else card.interval = Math.round(card.interval * card.ef);
      card.due = addDays(card.interval);
      card.reviews ||= [];
      card.reviews.push({ grade, at: new Date().toISOString() });
      if (grade === "good" || grade === "easy") updateTopicMastery("squares", 3);
      answerVisible = false;
      activeCardIndex = (activeCardIndex + 1) % deck.cards.length;
      saveDb();
      renderPage();
    }

    function bindImageExplainer() {
      const stage = $("#imageStage"), box = $("#selBox");

        const r = stage.getBoundingClientRect();
        start = { x: e.clientX - r.left, y: e.clientY - r.top };
        box.style.display = "block";
      });
      stage.addEventListener("mousemove", e => {
        if (!start) return;
        const r = stage.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        box.style.left = Math.min(start.x, x) + "px";
        box.style.top = Math.min(start.y, y) + "px";
        box.style.width = Math.abs(x - start.x) + "px";
        box.style.height = Math.abs(y - start.y) + "px";
      });
      stage.addEventListener("mouseup", () => {
        start = null;
        $("#imageOut").innerHTML = `

        <section class="card">
          <div class="chip-row" style="justify-content:space-between"><h2>Notifications</h2><button class="btn" onclick="clearNotifications()">Clear all</button></div>
          ${db.notifications.map(n => `<div class="notification-item" onclick="markRead('${n.id}')"><div><span class="chip">${n.category}</span><h3 style="margin-top:8px">${n.title}</h3><p>${n.body}</p></div><span class="chip ${n.read ? "" : "active"}">${n.read ? "Read" : "Unread"}</span></div>`).join("")}
          <button class="btn" style="margin-top:16px" onclick="go('#/settings')">Notification settings</button>
        </section>
      `;
    }

    function profilePage() {
      return `
        <section class="grid grid-2">
          <div class="card">
            <div class="chip-row">
              <div class="avatar" style="width:84px;height:84px;font-size:2rem">${db.user.firstName[0]}</div>
              <div><h2>${db.user.fullName}</h2><p>Class 8 · CBSE · ${db.user.streak}-day streak</p></div>
            </div>
            <input type="file" class="input" accept="image/*" style="margin-top:16px" />
            <p class="micro muted">Avatar upload is client-resized in production and stored with signed URLs.</p>
          </div>
          <div class="card">
            <h2>Achievements</h2>
            <div class="chip-row">
              ${db.achievements.map(a => `<div class="chip ${a.earned ? "active" : ""}" style="${a.earned ? "" : "opacity:.45"}">${a.icon} ${a.name}</div>`).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function settingsPage() {
      return `
        <section class="grid grid-2">
          <div class="card">
            <h2>Learning Preferences</h2>
            <label class="small">Explanation style</label>
            <select class="select pref" data-key="explanationStyle">
              ${["simple","detailed","exam_focused","visual"].map(x => `<option ${db.user.aiPreferences.explanationStyle===x?"selected":""}>${x}</option>`).join("")}
            </select>
            <label class="small">Default quiz difficulty</label>
            <select class="select pref" data-key="defaultDifficulty">
              ${["adaptive","easy","medium","hard"].map(x => `<option ${db.user.aiPreferences.defaultDifficulty===x?"selected":""}>${x}</option>`).join("")}
            </select>
            <label class="small">Session length</label>
            <input class="input pref" data-key="sessionLength" type="number" value="${db.user.aiPreferences.sessionLength}" />
            <button class="btn primary" style="margin-top:14px" onclick="showToast('Settings saved and fed into AI calls.')">Save</button>
          </div>
          <div class="card">
            <h2>Account / Security / Notifications / Appearance</h2>
            <p>Controls for password, OAuth, categories, signed storage, accessibility, and UI preferences.</p>
            <button class="btn danger" onclick="db.session=false;saveDb();go('#/login')">Sign out</button>
          </div>
        </section>
      `;
    }

    function bindSettings() {
      $$(".pref").forEach(el => el.addEventListener("change", () => {
        db.user.aiPreferences[el.dataset.key] = el.type === "number" ? Number(el.value) : el.value;
        saveDb();
      }));
    }

    function openQuickAsk() {
      $("#fab").click();
    }

    function toggleFab(force) {
      const pop = $("#fabPop");
      if (force === false) pop.classList.remove("show");
      else pop.classList.toggle("show");
    }

    function openCmd() {
      $("#cmdModal").classList.add("show");
      renderCmdResults("");
      setTimeout(() => $("#cmdInput").focus(), 0);
    }

    function closeCmd() {
      $("#cmdModal").classList.remove("show");
    }

    $("#cmdInput").addEventListener("input", e => {
      cmdIndex = 0;
      renderCmdResults(e.target.value);
    });

    $("#cmdInput").addEventListener("keydown", e => {
      const results = $$(".cmd-result");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        cmdIndex = Math.min(results.length - 1, cmdIndex + 1);
        renderCmdResults($("#cmdInput").value);
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        cmdIndex = Math.max(0, cmdIndex - 1);
        renderCmdResults($("#cmdInput").value);
      }
      if (e.key === "Enter" && results[cmdIndex]) {
        e.preventDefault();
        results[cmdIndex].click();
      }
    });

    function renderCmdResults(q) {
      const staticCmds = routes.map(r => ({ label: r[0], href: r[1], group: "Commands" }));
      const dynamic = q.length >= 2 ? [
        ...db.notes.slice(0,3).map(n => ({ label: n.title, href: "#/notes", group: "Notes" })),
        ...db.decks.slice(0,3).map(d => ({ label: d.title, href: "#/flashcards", group: "Flashcards" })),
        ...db.attempts.slice(0,3).map(a => ({ label: a.title, href: "#/quizzes", group: "Quizzes" }))
      ] : [];
      const all = [...staticCmds, ...dynamic].filter(x => x.label.toLowerCase().includes(q.toLowerCase()));
      $("#cmdResults").innerHTML = all.map((x,i) => `
        ${i === 0 || all[i-1].group !== x.group ? `<div class="nav-section">${x.group}</div>` : ""}
        <button class="cmd-result ${i===cmdIndex?"active":""}" onclick="closeCmd();go('${x.href}')"><span>${x.label}</span><span>↵</span></button>
      `).join("") || `<p class="muted">No results.</p>`;
    }

    function openModal(html) {
      $("#genericModal").innerHTML = `<div class="modal">${html}<div style="margin-top:14px"><button class="btn" onclick="closeModal()">Close</button></div></div>`;
      $("#genericModal").classList.add("show");
    }

    function closeModal() {
      $("#genericModal").classList.remove("show");
      $("#cmdModal").classList.remove("show");
    }

    function showToast(text) {
      const toast = document.createElement("div");
      toast.className = "card";
      toast.style.cssText = "position:fixed;right:20px;top:84px;z-index:120;max-width:360px";
      toast.innerHTML = `<strong>${escapeHtml(text)}</strong>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2600);
    }

    function markRead(id) {
      const n = db.notifications.find(x => x.id === id);
      if (n) n.read = true;
      saveDb();
      render();
    }

    function clearNotifications() {
      db.notifications = [];
      saveDb();
      renderPage();
    }

    function updateTopicMastery(topicId, delta, forceStatus) {
      const t = db.topics.find(x => x.id === topicId);
      if (!t) return;
      t.mastery = Math.max(0, Math.min(100, Math.round(t.mastery + delta)));
      t.status = forceStatus || masteryStatus(t.mastery);
      t.last = "Today";
      t.time += 10;
      saveDb();
    }

    function masteryStatus(score) {
      if (score >= 85) return "mastered";
      if (score >= 70) return "strong";
      if (score >= 45) return "learning";
      if (score >= 25) return "needs_revision";
      if (score >= 1) return "weak";
      return "not_started";
    }

    function statusColor(status) {
      return {
        mastered: "var(--success)",
        strong: "var(--blue)",
        learning: "var(--purple)",
        needs_revision: "var(--warning)",
        weak: "var(--danger)",
        not_started: "#334155"
      }[status] || "#334155";
    }

    function statusLabel(status) {
      return {
        mastered: "✓ Mastered",
        strong: "● Strong",
        learning: "◐ Learning",
        needs_revision: "△ Needs Revision",
        weak: "◇ Weak",
        not_started: "○ Not Started"
      }[status] || status;
    }

    function recommendedAction(t) {
      if (t.mastery >= 85) return "Maintain with spaced repetition.";
      if (t.mastery >= 70) return "Take a harder quiz.";
      if (t.mastery >= 45) return "Review notes, then practice.";
      if (t.mastery >= 25) return "Revise concept and solve guided problems.";
      return "Start with a simple tutor explanation.";
    }

    function examReadiness(exam) {
      const ts = db.topics.filter(t => exam.topics.includes(t.id));
      return Math.round(ts.reduce((a,t)=>a+t.mastery,0)/ts.length);
    }

    function subjectName(id) {
      return subjects.find(s => s.id === id)?.name || "General";
    }

    function shorten(s, n) {
      return s.length > n ? s.slice(0, n - 1) + "…" : s;
    }

    function scrollMessages() {
      const m = $("#messages");
      if (m) m.scrollTop = m.scrollHeight;
    }

    function copyText(btn) {
      const code = btn.parentElement.querySelector("code").textContent;
      navigator.clipboard?.writeText(code);
      showToast("Copied code.");
    }

    function escapeHtml(str = "") {
      return String(str).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m]));
    }

    function escapeAttr(str = "") {
      return escapeHtml(str).replace(/"/g, "&quot;");
    }

    window.addEventListener("hashchange", () => {
      currentRoute = location.hash;
      render();
    });

    window.addEventListener("click", e => {
      if (e.target.classList.contains("modal-backdrop")) closeModal();
    });

    render();
  </script>
</body>
</html>
